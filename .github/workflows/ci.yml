name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Install zsh (the Observe collector script and its tests use zsh)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Autopilot tests (offline)
        run: cd app && python -B -m pytest -q -p no:cacheprovider tests
      - name: Traffic Generator tests (offline)
        run: cd traffic-generator/simulator && python -B -m pytest -q -p no:cacheprovider tests_offline
      - name: Lint (pyflakes, application code)
        run: python -m pyflakes app/autopilot/auth.py app/autopilot/aiops.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the complete Git history for secrets
        run: /tmp/gitleaks git . --redact --no-banner --exit-code 1 --log-opts="--all"
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -f deploy/common/Dockerfile -t aplab-py:ci .
      - name: Smoke-test the image (byte-compile + auth CLI)
        run: |
          docker run --rm -e PYTHONPYCACHEPREFIX=/tmp/pyc aplab-py:ci python -m compileall -q /opt/aplab/autopilot /opt/aplab/services /opt/aplab/aplab
          docker run --rm aplab-py:ci python -m autopilot.auth --help
